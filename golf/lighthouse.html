<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="ad.size" content="320x480" />
<title>Golf Dreams -- Lighthouse Hole 1</title>
<script src="mraid.js"></script>
<style>
  :root {
    --sky-top: #c9b6e6;
    --sky-mid: #f3c7a0;
    --sky-hz: #8ed4e8;
    --sea: #2a8aaa;
    --sea-deep: #1a5e78;
    --green-a: #3db35a;
    --green-b: #2e8f48;
    --green-edge: #247a3c;
    --bunker: #e6c36a;
    --cliff: #8a5a3a;
    --ink: #1a2438;
    --paper: #fffdf6;
    --cta: #f0a020;
    --cta-ink: #1a2438;
    --good: #54f0a3;
    --warn: #ffd36b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #071018;
    touch-action: none;
    font-family: "Trebuchet MS", "Avenir Next", "Segoe UI", sans-serif;
  }
  body { display: flex; align-items: stretch; justify-content: stretch; }
  .shake {
    flex: 1;
    width: 100%;
    height: 100%;
    will-change: transform;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    background: #0b1c28;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; z-index: 2; }
  .hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 8;
    display: flex;
    align-self: stretch;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    padding: max(18px, calc(env(safe-area-inset-top) + 8px)) 10px 0;
    width: 100%;
    pointer-events: none;
    animation: slam 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.08s both;
  }
  .hud-left, .hud-mid, .hud-right {
    pointer-events: auto;
    min-width: 0;
  }
  .hud-left {
    background: rgba(10, 22, 34, 0.88);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    padding: 6px 10px;
    color: var(--paper);
  }
  .hole-name { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85; }
  .hole-meta { font-size: 15px; font-weight: 800; }
  .hud-mid {
    display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1;
    background: rgba(10, 22, 34, 0.88);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    padding: 6px 12px;
    max-width: 42%;
  }
  .stars { display: flex; gap: 4px; }
  .star {
    width: 22px; height: 22px;
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .star.on { transform: scale(1.18); }
  .score-row {
    display: flex; align-items: baseline; gap: 6px;
    color: var(--paper);
    text-shadow: 0 2px 8px rgba(0,0,0,0.45);
  }
  .score-row .lbl { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.8; }
  .score-row .num { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .score-row.bump .num { animation: bump 0.42s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .cta-mini {
    pointer-events: auto;
    background: var(--cta);
    color: var(--cta-ink);
    border: 0;
    border-radius: 999px;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.04em;
    padding: 9px 14px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.28);
    animation: pulseCta 1.6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    cursor: pointer;
    white-space: nowrap;
  }
  .cta-mini:active, .cta-big:active {
    transform: scale(0.95);
    animation: none;
  }
  .banner {
    position: absolute;
    top: max(88px, calc(env(safe-area-inset-top) + 72px));
    left: 48px; right: 48px;
    z-index: 8;
    align-self: stretch;
    width: auto;
    text-align: center;
    pointer-events: none;
    animation: slam 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.18s both;
  }
  .banner span {
    display: inline-block;
    background: rgba(12, 28, 42, 0.88);
    color: var(--paper);
    font-weight: 800;
    font-size: 18px;
    line-height: 1.2;
    padding: 9px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 10px 24px rgba(0,0,0,0.28);
  }
  .caddie {
    position: absolute;
    left: 10px; bottom: 10px;
    z-index: 8;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 52%;
    pointer-events: none;
    animation: slam 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.28s both;
  }
  .caddie-body {
    width: 56px; height: 72px; position: relative; flex: 0 0 auto;
  }
  .caddie-bubble {
    background: var(--paper);
    color: var(--ink);
    border-radius: 12px 12px 12px 4px;
    padding: 9px 12px;
    font-size: 15px;
    font-weight: 800;
    line-height: 1.2;
    box-shadow: 0 8px 18px rgba(0,0,0,0.22);
  }
  .caddie .mouth-happy, .caddie .mouth-shock { opacity: 0; }
  .caddie.happy .mouth-idle, .caddie.shock .mouth-idle { opacity: 0; }
  .caddie.happy .mouth-happy, .caddie.shock .mouth-shock { opacity: 1; }
  .stage.end-on .banner, .stage.end-on .caddie, .stage.end-on .hint, .stage.end-on .slam, .stage.end-on .pop, .stage.end-on .floater, .stage.end-on .hud-left, .stage.end-on .hud-mid { display: none !important; }
  .stage.end-on .hud { justify-content: flex-end; }
  .hint {
    position: absolute;
    z-index: 7;
    width: 72px; height: 72px;
    pointer-events: none;
    opacity: 0;
    transition: none;
    filter: drop-shadow(0 2px 0 #1a2438);
  }
  .hint.show { opacity: 1; }
  .flash {
    position: absolute; inset: 0; z-index: 12; pointer-events: none;
    background: #fff; opacity: 0;
  }
  .flash.in { animation: flashIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .flash.pop { animation: flashPop 0.22s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .pop, .slam, .floater {
    position: absolute; z-index: 11; pointer-events: none;
    font-weight: 900; color: #fff;
    transform: translate(-50%, -50%) scale(0.4);
    opacity: 0;
    white-space: nowrap;
  }
  .pop {
    text-shadow: 0 3px 0 #1a5a2a, 0 8px 18px rgba(0,0,0,0.35);
    -webkit-text-stroke: 5px #1a2438;
    paint-order: stroke fill;
    font-size: 56px;
  }
  .pop.go { animation: popSlam 0.78s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  .slam {
    left: 50%; top: 14%;
    z-index: 14;
    font-size: 38px;
    letter-spacing: -0.03em;
    -webkit-text-stroke: 8px #1a2438;
    paint-order: stroke fill;
    text-shadow: 0 10px 0 #1a2438;
  }
  .slam.go { animation: popSlam 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  .floater {
    z-index: 11;
    font-size: 28px;
    color: #ffd36b;
    -webkit-text-stroke: 4px #1a2438;
    paint-order: stroke fill;
  }
  .floater.go { animation: floatScore 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .end {
    position: absolute; inset: 0; z-index: 20;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(6, 16, 24, 0.72);
  }
  .end.show { display: flex; animation: fadeUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .end-card {
    width: min(360px, calc(100% - 28px));
    background: linear-gradient(180deg, #16324a, #0c1c28);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 22px;
    padding: 22px 18px 18px;
    text-align: center;
    color: var(--paper);
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    animation: slam 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .wordmark {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: -0.03em;
    color: #fff;
    -webkit-text-stroke: 6px #2d8a3e;
    paint-order: stroke fill;
    line-height: 1;
  }
  .end-sub { margin-top: 8px; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.85; }
  .end-stats { margin: 14px 0 18px; font-size: 16px; font-weight: 700; }
  .cta-big {
    width: 100%;
    background: var(--cta);
    color: var(--cta-ink);
    border: 0;
    border-radius: 14px;
    font-size: 20px;
    font-weight: 900;
    padding: 15px 12px;
    cursor: pointer;
    animation: pulseCta 1.6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }
  .stores { margin-top: 10px; font-size: 11px; opacity: 0.7; }
  .hitstop, .hitstop * { animation-play-state: paused !important; }
  @keyframes slam {
    from { transform: translateY(-28px) scale(0.86); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  @keyframes bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.28); }
    100% { transform: scale(1); }
  }
  @keyframes pulseCta {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  @keyframes flashIn {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes flashPop {
    0% { opacity: 0.85; }
    100% { opacity: 0; }
  }
  @keyframes popSlam {
    0% { transform: translate(-50%, -46%) scale(0.55); opacity: 0; }
    10% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    68% { transform: translate(-50%, -54%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -64%) scale(0.96); opacity: 0; }
  }
  @keyframes fadeUp {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes floatScore {
    0% { transform: translate(-50%, -40%) scale(0.6); opacity: 0; }
    30% { transform: translate(-50%, -70%) scale(1.12); opacity: 1; }
    100% { transform: translate(-50%, -120%) scale(1); opacity: 0; }
  }
  @media (orientation: landscape) {
    .banner { top: max(78px, calc(env(safe-area-inset-top) + 62px)); }
    .banner span { font-size: 16px; }
    .caddie { max-width: 48%; bottom: 8px; }
    .wordmark { font-size: 28px; }
    .slam { font-size: 28px; top: 10%; }
    .pop { font-size: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flash.in, .flash.pop { animation: none; opacity: 0; }
    .cta-mini, .cta-big { animation: none; }
  }
</style>
</head>

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function dist(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return Math.hypot(dx, dy); }
function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }
function easeOutBack(t) {
  const c = 1.70158;
  const k = t - 1;
  return 1 + (c + 1) * k * k * k + c * k * k;
}
function now() { return performance.now(); }
function addTrauma(amt) {
  const scale = REDUCE ? 0.2 : CFG.juice.reduceShake;

}

}

}

}

function landscape() { return W > H; }

function worldToScreen(p) {
  const f = landscape() ? CFG.frameL : CFG.frameP;
  const x = plateDraw.dx + plateDraw.dw * lerp(f.left, f.right, clamp(p.x, 0, 1));
  const y = plateDraw.dy + plateDraw.dh * lerp(f.far, f.near, clamp(p.y, 0, 1));
  const scale = lerp(f.scaleFar, f.scaleNear, clamp(p.y, 0, 1));
  return { x, y, scale, r: 16 * scale };
}

function idealAim(shot) {
  const aim = {
    x: shot.hole.x - shot.brk.x * 0.55,
    y: shot.hole.y - shot.brk.y * 0.55
  };
  const dx = aim.x - shot.ball.x;
  const dy = aim.y - shot.ball.y;
  const d = Math.hypot(dx, dy) || 1;
  const power = d * 2.65;
  return { x: (dx / d) * power, y: (dy / d) * power, aim };
}

function resetShot(i) {
  const s = CFG.shots[i];
  ball = { x: s.ball.x, y: s.ball.y };
  hole = { x: s.hole.x, y: s.hole.y };
  vel = { x: 0, y: 0 };
  squash = 1; stretch = 1; ballScale = 0;
  ballSpin = 0; ballFlash = 0; ballFall = 0; pinHit = false;
  appearAt = now();
  dragging = false; dragPt = null;
  idleAt = now();
  hideHint(true);
  bannerText.textContent = i === 0 ? CFG.hookCaption : CFG.shotCaptions[i];
  setCaddie(i === 0 ? CFG.caddieLine : CFG.caddieShots[i], "");
  trail = [];
  phase = "aim";
  window.__qa.phase = "aim";
  window.__qa.shotIndex = i;
  syncIdeal();
}

function syncIdeal() {
  const b = worldToScreen(ball);
  const h = worldToScreen(hole);
  const ax = b.x - h.x;
  const ay = b.y - h.y;
  const alen = Math.hypot(ax, ay) || 1;
  const back = 92;
  window.__qa.ball = b;
  window.__qa.idealFrom = { x: b.x, y: b.y };
  window.__qa.idealTo = { x: b.x + (ax / alen) * back, y: b.y + (ay / alen) * back };
  window.__qa.hole = h;
  window.__qa.plateDraw = plateDraw;
}

    starsEl.appendChild(svg);

}

function unlockAudio() {
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
  loadSfx().then(startBed);
}

function dataToArrayBuffer(uri) {
  const b64 = uri.split(",")[1] || "";
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr.buffer;
}

async function loadSfx() {
  if (!audioCtx) return;
  await Promise.all(Object.keys(SFX).map(async (k) => {
    try {
      sfxBuf[k] = await audioCtx.decodeAudioData(dataToArrayBuffer(SFX[k]).slice(0));
    } catch (e) {}
  }));
}

function duckBed(to, ms) {
  if (!bedGainNode || !audioCtx) return;
  const t = audioCtx.currentTime;
  bedGainNode.gain.cancelScheduledValues(t);
  bedGainNode.gain.setValueAtTime(bedGainNode.gain.value, t);
  bedGainNode.gain.linearRampToValueAtTime(to, t + 0.05);
  bedGainNode.gain.linearRampToValueAtTime(0.16, t + (ms || 0.4));
}

function playSample(name, gain, rate) {
  if (!audioCtx || !sfxBuf[name]) return false;
  const src = audioCtx.createBufferSource();
  src.buffer = sfxBuf[name];
  src.playbackRate.value = rate || 1;
  const g = audioCtx.createGain();
  g.gain.value = gain == null ? 0.88 : gain;
  src.connect(g); g.connect(audioCtx.destination);
  src.start();
  duckBed(0.04, 0.45);
  return true;
}

function startBed() {
  if (bedStarted || !audioCtx || !sfxBuf.bed) return;
  bedStarted = true;
  const src = audioCtx.createBufferSource();
  src.buffer = sfxBuf.bed;
  src.loop = true;
  bedGainNode = audioCtx.createGain();
  bedGainNode.gain.value = 0;
  src.connect(bedGainNode);
  bedGainNode.connect(audioCtx.destination);
  src.start();
  bedGainNode.gain.linearRampToValueAtTime(0.17, audioCtx.currentTime + 1.1);
}

function beep(freq, dur, type, gain, slide) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, audioCtx.currentTime + dur);
  g.gain.setValueAtTime(gain || 0.08, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur + 0.02);
}

function sfx(kind) {
  if (kind === "tick") { beep(420, 0.05, "triangle", 0.04); return; }
  if (kind === "thock") {
    if (playSample("thock", 0.95, 0.96 + Math.random() * 0.08)) return;
    beep(140, 0.09, "sine", 0.12); beep(90, 0.12, "triangle", 0.08);
    return;
  }
  if (kind === "clank" || kind === "knock" || kind === "lip") {
    const rate = kind === "lip" ? 1.1 : 0.94 + Math.random() * 0.12;
    if (playSample("clank", kind === "lip" ? 0.72 : 1, rate)) return;
    beep(110, 0.11, "sine", 0.16);
    beep(70, 0.14, "square", 0.05);
    beep(190, 0.08, "triangle", 0.07, 80);
    return;
  }
  if (kind === "sink") {
    if (playSample("sink", 0.92, 1)) return;
    beep(320, 0.18, "sine", 0.1, 720); beep(480, 0.22, "triangle", 0.06, 960);
    return;
  }
  if (kind === "crowd") {
    noiseBurst(0.55, 0.05);
    [196, 247, 330].forEach((f, i) => setTimeout(() => beep(f, 0.42, "sine", 0.035, f * 1.35), i * 50));
  }
  if (kind === "fanfare") {
    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.22, "square", 0.06), i * 70));
  }
}

function noiseBurst(dur, gain) {
  if (!audioCtx) return;
  const n = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const bp = audioCtx.createBiquadFilter();
  bp.type = "bandpass";
  bp.frequency.value = 340;
  bp.Q.value = 0.8;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(gain, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  src.connect(bp); bp.connect(g); g.connect(audioCtx.destination);
  src.start();
}

function hitStop(ms) {
  freezeUntil = now() + ms;
  document.body.classList.add("hitstop");
  setTimeout(() => document.body.classList.remove("hitstop"), ms);
}

function spawn(n, make) {
  for (let i = 0; i < n && particles.length < 28; i++) particles.push(make());
}

function juiceSink(hero) {
  const s = worldToScreen(hole);
  feedback(hero ? "large" : "medium", hole);
  punch = hero ? 0.14 : 0.07;
  if (!REDUCE) {
    flashEl.classList.remove("in", "pop");
    void flashEl.offsetWidth;
    flashEl.classList.add("pop");
  }
  spawn(hero ? 22 : 12, () => ({
    x: s.x, y: s.y,

    life: 1,
    c: hero ? ["#fff", "#ffd36b", "#54f0a3", "#f0a020", "#ff7a5c"][particles.length % 5] : "#e8ffe8",

    rect: hero && particles.length % 2 === 0
  }));
  popEl.textContent = hero ? "PERFECT!" : (shotIndex === 1 ? "DRAINED!" : "NICE!");
  popEl.style.left = s.x + "px";

  popEl.classList.remove("go");
  void popEl.offsetWidth;
  popEl.classList.add("go");
  const pts = CFG.scoring.perSink + (hero ? CFG.scoring.perfectBonus : 0);

}

function hideHint(resetPos) {
  hintEl.classList.remove("show");
  if (resetPos) {
    hintEl.style.transition = "none";
    hintEl.style.position = "";
    hintEl.style.left = "";
    hintEl.style.top = "";
    hintEl.style.zIndex = "";
  }
}

function showHint() {
  if (phase !== "aim" || dragging) return;
  if (shotIndex === 0 && window.__qa.shots === 0) return;
  const from = window.__qa.idealFrom, to = window.__qa.idealTo;
  if (!from || !to) return;
  hintEl.style.transition = "none";
  hintEl.style.left = (from.x - 16) + "px";
  hintEl.style.top = (from.y - 16) + "px";
  hintEl.classList.add("show");
  requestAnimationFrame(() => {
    hintEl.style.transition = "left 0.85s cubic-bezier(0.22,1,0.36,1), top 0.85s cubic-bezier(0.22,1,0.36,1), opacity 0.25s";
    hintEl.style.left = (to.x - 10) + "px";
    hintEl.style.top = (to.y - 10) + "px";
  });
  setTimeout(() => {
    if (phase === "aim" && !dragging) {
      hintEl.classList.remove("show");
      idleAt = now() - CFG.hintIdleMs + 280;
    }
  }, 980);
}

function storeUrl() {
  const ua = navigator.userAgent || "";
  return /iPhone|iPad|iPod/i.test(ua) ? CFG.store.ios : CFG.store.android;
}

function openStore() {
  const url = storeUrl();
  window.__qa.cta = true;
  try {
    if (window.mraid && typeof window.mraid.open === "function") window.mraid.open(url);
  } catch (e) { window.__qa.errors.push("mraid.open " + e); }

document.getElementById("ctaMini").addEventListener("click", openStore);
document.getElementById("ctaBig").addEventListener("click", openStore);

function ptr(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function onDown(e) {
  e.preventDefault();
  unlockAudio();
  sfx("tick");
  hideHint(true);
  if (ended || (phase !== "aim" && phase !== "intro")) return;
  if (phase === "intro") return;
  const p = ptr(e);
  const b = worldToScreen(ball);
  if (Math.hypot(p.x - b.x, p.y - b.y) > 64) return;
  dragging = true;
  dragPt = p;
  canvas.setPointerCapture(e.pointerId);
}

function onMove(e) {
  if (!dragging) return;
  e.preventDefault();
  dragPt = ptr(e);
}

function onUp(e) {
  if (!dragging) return;
  e.preventDefault();
  dragging = false;
  const b = worldToScreen(ball);
  const p = dragPt || b;
  const f = landscape() ? CFG.frameL : CFG.frameP;
  const spanX = Math.max(1, (f.right - f.left) * plateDraw.dw);
  const spanY = Math.max(1, (f.near - f.far) * plateDraw.dh);
  const pullWX = (p.x - b.x) / spanX;
  const pullWY = (p.y - b.y) / spanY;
  const pull = Math.hypot(pullWX, pullWY);
  if (pull * Math.min(spanX, spanY) < 8) { idleAt = now(); return; }
  const shot = CFG.shots[shotIndex];
  const flyX = -pullWX, flyY = -pullWY;
  const fLen = Math.hypot(flyX, flyY) || 1;
  const dirX = flyX / fLen, dirY = flyY / fLen;
  const id = idealAim(shot);
  const iLen = Math.hypot(id.x, id.y) || 1;
  const iX = id.x / iLen, iY = id.y / iLen;
  let mag = clamp(pull / 0.28, 0.62, 1.12) * iLen;
  if (shotIndex === 0) mag = Math.max(mag, iLen * 0.98);
  const close = Math.max(0, dirX * iX + dirY * iY);
  const floor = shotIndex === 0 ? 0.90 : (shotIndex === 1 && !shot.scriptedLipOut ? 0.86 : 0);
  const mix = clamp(Math.max(shot.assist * close, floor), 0, 0.96);
  const vx = lerp(dirX, iX, mix);
  const vy = lerp(dirY, iY, mix);
  const vLen = Math.hypot(vx, vy) || 1;
  vel = { x: (vx / vLen) * mag, y: (vy / vLen) * mag };
  window.__qa.shots += 1;
  setPhase("rolling");
  squash = 0.78; stretch = 1.28;
  trail = [];
  feedback("small", ball);
  sfx("thock");
  window.__rollAt = now();
}

["pointerdown", "pointermove", "pointerup", "pointercancel"].forEach((ev, i) => {
  canvas.addEventListener(ev, [onDown, onMove, onUp, onUp][i], { passive: false });
});

function inHole(p, rad) { return dist(p, hole) < rad; }

function stepPhysics(dt) {
  if (now() < freezeUntil) return;
  if (phase === "intro" && tease) {
    tease.vx += (hole.x - tease.x) * dt * 0.9;
    tease.vy += (hole.y - tease.y) * dt * 0.9;
    tease.vx *= 0.965; tease.vy *= 0.965;
    tease.x += tease.vx * dt * 0.5;
    tease.y += tease.vy * dt * 0.5;
    if (dist(tease, hole) < 0.09) { tease.vx = 0; tease.vy = 0; }
    return;
  }
  if (phase !== "rolling" && phase !== "lip") return;
  const shot = CFG.shots[shotIndex];
  if (phase === "rolling") {
    const spd = Math.hypot(vel.x, vel.y);
    vel.x += shot.brk.x * dt * 0.4 * Math.min(1, spd);
    vel.y += shot.brk.y * dt * 0.4 * Math.min(1, spd);
  }
  const damp = Math.pow(CFG.friction, dt * 60);
  const spd0 = Math.hypot(vel.x, vel.y);
  const grass = spd0 < 0.16 ? 0.965 : 1;
  vel.x *= damp * grass; vel.y *= damp * grass;
  ball.x += vel.x * dt * 0.60;
  ball.y += vel.y * dt * 0.60;
  ballSpin += spd0 * dt * 11;
  ballFlash = Math.max(0, ballFlash - dt * 3.4);
  ball.x = clamp(ball.x, 0.10, 0.90);
  ball.y = clamp(ball.y, 0.08, 0.96);
  window.__qa.ball = worldToScreen(ball);

  const speed = Math.hypot(vel.x, vel.y);
  const toHole = dist(ball, hole);
  if (toHole > CFG.lipRadius * 2.2) pinHit = false;
  if (shotIndex === 0 && phase === "rolling" && inHole(ball, CFG.holeRadius * 1.7)) {
    sink();
    return;
  }
  if (shot.scriptedLipOut && !lipUsed && shotIndex === 1 && toHole < CFG.lipRadius * 1.25) {
    beginLip(0.42, 0.12);
    return;
  }
  if (toHole < CFG.lipRadius && speed > CFG.captureSpeed && shotIndex !== 0) {
    const nx = (ball.x - hole.x) / (toHole || 1);
    const ny = (ball.y - hole.y) / (toHole || 1);
    const vn = vel.x * nx + vel.y * ny;
    if (vn < 0) {
      vel.x -= 1.55 * vn * nx;
      vel.y -= 1.55 * vn * ny;
      vel.x *= 0.78; vel.y *= 0.78;
      if (!pinHit) {
        pinHit = true;
        squash = 0.6; stretch = 1.4;
        ballFlash = 1;
        sfx("clank");
        hitStop(40);
        addTrauma(0.24);
      }
      if (shot.scriptedLipOut && !lipUsed && shotIndex === 1) beginLip(0, 0);
    }
  }

  if (inHole(ball, CFG.holeRadius * 1.55) && speed < CFG.captureSpeed * 1.45 && phase !== "lip") {
    if (shot.scriptedLipOut && !lipUsed && shotIndex === 1) {
      beginLip(0.2, -0.06);
      return;
    }
    sink();
    return;
  }
  if (toHole < CFG.lipRadius) {
    vel.x *= 0.9;
    vel.y *= 0.9;
  }
  if (shotIndex === 0 && phase === "rolling" && toHole < 0.45) {
    ball.x += (hole.x - ball.x) * dt * 1.05;
    ball.y += (hole.y - ball.y) * dt * 1.05;
  }
  if (shotIndex === 1 && !lipUsed && phase === "rolling" && toHole < 0.16) {
    ball.x += (hole.x - ball.x) * dt * 0.4;
    ball.y += (hole.y - ball.y) * dt * 0.4;
  }
  if (shotIndex === 2 && phase === "rolling" && toHole < 0.15) {
    ball.x += (hole.x - ball.x) * dt * 0.55;
    ball.y += (hole.y - ball.y) * dt * 0.55;
  }

  if (speed < 0.02 && phase === "rolling") {
    vel = { x: 0, y: 0 };
    if (shotIndex === 0 || toHole < 0.20 || inHole(ball, CFG.lipRadius * 2.2)) sink();
    else {
      setPhase("aim");
      idleAt = now();
      setCaddie("A bit more. From the ball.", "");
    }
  }
  if (phase === "lip" && (speed < 0.03 || now() - lipAt > 700)) {
    vel = { x: 0, y: 0 };
    CFG.shots[1].assist = 0.92;
    CFG.shots[1].scriptedLipOut = false;
    CFG.shots[1].ball = { x: ball.x, y: ball.y };
    setPhase("aim");
    idleAt = now();
    setCaddie("Lip. Same line. Commit.", "shock");
    bannerText.textContent = "So close. Same drag.";
  }
  squash = lerp(squash, 1, 0.12);
  stretch = lerp(stretch, 1, 0.12);
  if (phase === "rolling" && Math.hypot(vel.x, vel.y) > 0.12) {
    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 10) trail.shift();
    if (now() - dustAt > 90) {
      dustAt = now();
      dustBurst(ball, 1, "#cfe6a4");
    }
  }
}

function beginLip(kickX, kickY) {
  lipUsed = true;
  if (kickX || kickY) { vel.x = kickX; vel.y = kickY; }
  setPhase("lip");
  lipAt = now();
  sfx("clank");
  squash = 0.58; stretch = 1.48;
  ballFlash = 1;
  feedback("medium", hole);
  setCaddie("Lip. Same line. Commit.", "shock");
  bannerText.textContent = "So close. Same drag.";
  spawn(10, () => ({
    x: worldToScreen(hole).x, y: worldToScreen(hole).y,
    vx: (Math.random() - 0.5) * 7, vy: -Math.random() * 5,
    life: 0.85, c: "#fff", r: 2.6, rect: false
  }));
}

function sink() {
  if (phase === "sink" || phase === "end") return;
  setPhase("sink");
  vel = { x: 0, y: 0 };
  window.__qa.sinks += 1;
  const hero = shotIndex === 2;
  const pts = CFG.scoring.perSink + (hero ? CFG.scoring.perfectBonus : 0);
  bumpScore(pts);
  fillStar(shotIndex);
  const from = { x: ball.x, y: ball.y };
  const goNext = () => {
    if (shotIndex < 2) {
      shotIndex += 1;
      resetShot(shotIndex);
    } else {
      showEnd();
    }
  };
  const dropIn = () => {
    const tStart = now();
    const drop = () => {
      const k = clamp((now() - tStart) / 520, 0, 1);
      const e = easeOutQuad(k);
      ball.x = lerp(from.x, hole.x, e);
      ball.y = lerp(from.y, hole.y, e);
      const fall = k < 0.42 ? 1 : Math.max(0, 1 - easeOutQuad((k - 0.42) / 0.58));
      ballScale = fall;
      ballFall = k < 0.42 ? 0 : (k - 0.42) * 18;
      if (k < 1) requestAnimationFrame(drop);
      else {
        ballScale = 0;
        ballFall = 0;
        setTimeout(goNext, 420);
      }
    };
    drop();
  };
  dropIn();
  setTimeout(() => {
    juiceSink(hero);
    if (hero) {
      setCaddie("In!", "happy");
      bannerText.textContent = "That's the hole.";
    } else {
      bannerText.textContent = shotIndex === 0 ? "That's the touch." : "That's the line.";
      setCaddie(shotIndex === 0 ? "That's the touch." : "Crowd likes that.", "happy");
    }
  }, 300);
}

function showEnd() {
  if (ended) return;
  ended = true;
  setPhase("end");
  window.__qa.endCard = true;
  endStats.textContent = "Hole complete  ·  3 putts  ·  " + scoreTarget + " pts";
  document.getElementById("stage").classList.add("end-on");
  endEl.classList.add("show");
  addTrauma(0.35);
  const mid = { x: W * 0.5, y: H * 0.42 };
  spawn(22, () => ({
    x: mid.x, y: mid.y,
    vx: (Math.random() - 0.5) * 18,
    vy: -Math.random() * 14 - 2,
    life: 1,
    c: ["#ffd36b", "#54f0a3", "#fff", "#f0a020"][particles.length % 4],
    r: 3.4, rect: particles.length % 3 === 0
  }));
}

function drawPlate() {
  const img = plateImg();
  if (!img.naturalWidth) {
    drawSky(0);
    drawSea(0);
    drawLighthouse(0);
    return;
  }
  const ir = img.naturalWidth / img.naturalHeight;
  const cr = W / H;
  let dw, dh, dx, dy;
  if (ir > cr) {
    dh = H; dw = H * ir; dx = 0; dy = 0;
  } else {
    dw = W; dh = W / ir; dx = 0; dy = 0;
  }
  plateDraw = { dx, dy, dw, dh };
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, dx, dy, dw, dh);
}

function drawBeam(t) {
  if (plateOk()) return;
  const L = landscape() ? CFG.lanternL : CFG.lanternP;
  const x = W * L.x, y = H * L.y;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(t * 0.32);
  const beam = ctx.createLinearGradient(8, 0, W * 0.42, 0);
  beam.addColorStop(0, "rgba(255, 228, 150, 0.20)");
  beam.addColorStop(0.2, "rgba(255, 210, 110, 0.07)");
  beam.addColorStop(1, "rgba(255, 210, 110, 0)");
  ctx.fillStyle = beam;
  ctx.beginPath();
  ctx.moveTo(6, 0);
  ctx.lineTo(W * 0.44, -14);
  ctx.lineTo(W * 0.44, 14);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "rgba(255, 236, 170, 0.9)";
  ctx.beginPath(); ctx.arc(0, 0, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawSky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.55);
  g.addColorStop(0, "#c9b6e6");
  g.addColorStop(0.45, "#f3c7a0");
  g.addColorStop(1, "#8ed4e8");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  for (let i = 0; i < 4; i++) {
    const cx = ((i * 0.31 + t * 0.012) % 1.2) * W - W * 0.1;
    const cy = H * (0.08 + (i % 2) * 0.05);
    ctx.beginPath();
    ctx.ellipse(cx, cy, 46, 16, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 28, cy + 4, 34, 12, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawSea(t) {
  const y0 = H * (landscape() ? 0.36 : 0.32);
  const g = ctx.createLinearGradient(0, y0, 0, H * 0.62);
  g.addColorStop(0, "#7ad0e6");
  g.addColorStop(0.25, "#3aa0c0");
  g.addColorStop(1, "#1a5e78");
  ctx.fillStyle = g;
  ctx.fillRect(0, y0, W, H - y0);
  ctx.strokeStyle = "rgba(255,255,255,0.22)";
  ctx.lineWidth = 1.6;
  for (let i = 0; i < 8; i++) {
    ctx.beginPath();
    const yy = y0 + 14 + i * 14;
    ctx.moveTo(0, yy);
    for (let x = 0; x <= W; x += 14) {
      ctx.lineTo(x, yy + Math.sin(x * 0.045 + t * 1.6 + i) * 2.4);
    }
    ctx.stroke();
  }
}

function drawLighthouse(t) {
  const x = W * 0.16, y = H * (landscape() ? 0.30 : 0.28), s = landscape() ? 0.78 : 1.05;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = "#5a3a28";
  ctx.beginPath();
  ctx.moveTo(-40, 88); ctx.lineTo(36, 88); ctx.lineTo(22, 28); ctx.lineTo(-18, 36); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#7a4e32";
  ctx.beginPath();
  ctx.moveTo(-36, 88); ctx.lineTo(8, 88); ctx.lineTo(4, 50); ctx.lineTo(-22, 54); ctx.closePath(); ctx.fill();
  const tw = ctx.createLinearGradient(-14, 0, 14, 0);
  tw.addColorStop(0, "#fff6ea"); tw.addColorStop(0.5, "#f4efe8"); tw.addColorStop(1, "#cfc4b4");
  ctx.fillStyle = tw;
  ctx.beginPath();
  ctx.moveTo(-13, 48); ctx.lineTo(13, 48); ctx.lineTo(8, -44); ctx.lineTo(-8, -44); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#c4453a";
  for (let i = 0; i < 5; i++) {
    const yy = 36 - i * 16;
    ctx.beginPath();
    ctx.moveTo(-12.2 + i * 0.8, yy);
    ctx.lineTo(12.2 - i * 0.8, yy);
    ctx.lineTo(11.2 - i * 0.8, yy - 7);
    ctx.lineTo(-11.2 + i * 0.8, yy - 7);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = "#1a2438";
  ctx.fillRect(-11, -54, 22, 12);
  ctx.fillStyle = "#ffd36b";
  ctx.fillRect(-7, -50, 14, 7);
  ctx.save();
  ctx.translate(0, -46);
  ctx.rotate(t * 0.55);
  const beam = ctx.createLinearGradient(0, 0, 130, 0);
  beam.addColorStop(0, "rgba(255, 220, 120, 0.55)");
  beam.addColorStop(1, "rgba(255, 220, 120, 0)");
  ctx.fillStyle = beam;
  ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(130, -22); ctx.lineTo(130, 22); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.fillStyle = "#c4453a";
  ctx.beginPath(); ctx.moveTo(-9, -54); ctx.lineTo(9, -54); ctx.lineTo(0, -68); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function greenVerts() {
  return [
    { x: 0.22, y: 0.10 }, { x: 0.50, y: 0.08 }, { x: 0.78, y: 0.10 },
    { x: 0.90, y: 0.24 }, { x: 0.88, y: 0.42 }, { x: 0.76, y: 0.58 },
    { x: 0.56, y: 0.66 }, { x: 0.40, y: 0.65 }, { x: 0.22, y: 0.54 },
    { x: 0.12, y: 0.36 }, { x: 0.14, y: 0.20 }
  ];
}
function tracePoly(pts) {
  const s = pts.map(worldToScreen);
  ctx.beginPath();
  ctx.moveTo((s[0].x + s[s.length - 1].x) / 2, (s[0].y + s[s.length - 1].y) / 2);
  for (let i = 0; i < s.length; i++) {
    const a = s[i];
    const b = s[(i + 1) % s.length];
    ctx.quadraticCurveTo(a.x, a.y, (a.x + b.x) / 2, (a.y + b.y) / 2);
  }
  ctx.closePath();
}
function drawCliff() {
  const rim = greenVerts().filter((p) => p.y >= 0.42);
  if (rim.length < 2) return;
  const pts = rim.map(worldToScreen);
  ctx.beginPath();
  ctx.moveTo(pts[0].x - 6, pts[0].y + 2);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y + 3);
  for (let i = pts.length - 1; i >= 0; i--) {
    ctx.lineTo(pts[i].x + (i % 2 ? 4 : -3), pts[i].y + 22 + (i % 3) * 6);
  }
  ctx.closePath();
  ctx.fillStyle = "#4a4254";
  ctx.fill();
}

function drawGreen(t) {
  const fringe = greenVerts().map((p) => ({ x: 0.5 + (p.x - 0.5) * 1.08, y: p.y * 1.02 + 0.01 }));
  ctx.fillStyle = "#2f4e2c";
  tracePoly(fringe); ctx.fill();
  ctx.save();
  tracePoly(greenVerts());
  ctx.clip();
  const top = worldToScreen({ x: 0.5, y: 0.66 });
  const bot = worldToScreen({ x: 0.5, y: 0.08 });
  const g = ctx.createLinearGradient(0, top.y, 0, bot.y);
  g.addColorStop(0, "#5a9a4c");
  g.addColorStop(1, "#3a6e3c");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 12; i++) {
    const y = 0.12 + i * 0.045;
    const l = worldToScreen({ x: 0.12, y });
    const r = worldToScreen({ x: 0.88, y });
    ctx.strokeStyle = i % 2 ? "rgba(40,80,42,0.14)" : "rgba(255,255,255,0.05)";
    ctx.lineWidth = lerp(8, 3, y);
    ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(r.x, r.y); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = "rgba(40, 70, 42, 0.7)";
  ctx.lineWidth = 3;
  tracePoly(greenVerts()); ctx.stroke();
  const rim = greenVerts();
  for (let i = 0; i < rim.length; i++) {
    if (rim[i].y < 0.38) continue;
    const s = worldToScreen(rim[i]);
    ctx.fillStyle = i % 2 ? "#4a7a38" : "#2f5c2c";
    ctx.beginPath();
    ctx.moveTo(s.x - 5, s.y + 2);
    ctx.lineTo(s.x, s.y - 8 - (i % 3));
    ctx.lineTo(s.x + 5, s.y + 2);
    ctx.closePath();
    ctx.fill();
  }
  const bun = CFG.bunker;
  const bs = worldToScreen(bun);
  ctx.fillStyle = "#edd07a";
  ctx.beginPath();
  ctx.ellipse(bs.x, bs.y, bun.rx * W * bs.scale * 1.15, bun.ry * H * 0.55, -0.35, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(140,90,30,0.35)";
  ctx.stroke();
}

function drawTrees(t) {
  const spots = [[0.12, 0.50], [0.88, 0.46], [0.78, 0.28], [0.18, 0.30]];
  spots.forEach(([x, y], i) => {
    const s = worldToScreen({ x, y });
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath(); ctx.ellipse(s.x, s.y + 10, 16, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#6b3e24";
    ctx.fillRect(s.x - 3, s.y - 6, 6, 16);
    ctx.fillStyle = i % 2 ? "#1f6a38" : "#2d8a4a";
    ctx.beginPath();
    ctx.arc(s.x, s.y - 18 + Math.sin(t + i) * 0.6, 18, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawHole(t) {
  if (plateOk()) return;
  const s = worldToScreen(hole);
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.beginPath(); ctx.ellipse(s.x, s.y + 2, 9 * s.scale, 5 * s.scale, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#0d1a12";
  ctx.beginPath(); ctx.ellipse(s.x, s.y, 8.2 * s.scale, 4.6 * s.scale, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#dfe8e2";
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.ellipse(s.x, s.y, 8.2 * s.scale, 4.6 * s.scale, 0, 0, Math.PI * 2); ctx.stroke();
  const wave = Math.sin(t * 3.2) * 0.18;
  ctx.save();
  ctx.translate(s.x + 7, s.y - 38);
  ctx.rotate(wave);
  ctx.strokeStyle = "#f4efe4";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 38); ctx.lineTo(0, 0); ctx.stroke();
  ctx.fillStyle = "#e23b3b";
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(16, 6 + Math.sin(t * 4) * 1.5); ctx.lineTo(0, 12); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawAim() {
  if (!dragging || !dragPt) return;
  const b = worldToScreen(ball);
  const p = dragPt;
  const dx = b.x - p.x, dy = b.y - p.y;
  const pow = clamp(Math.hypot(dx, dy) / 150, 0, 1);
  const col = pow < 0.45 ? "#54f0a3" : pow < 0.75 ? "#ffd36b" : "#ff7a5c";
  ctx.strokeStyle = col;
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(p.x, p.y); ctx.stroke();
  ctx.setLineDash([7, 8]);
  ctx.strokeStyle = "rgba(255,255,255,0.9)";
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(b.x + dx * 1.8, b.y + dy * 1.8);
  ctx.stroke();
  ctx.setLineDash([]);
  const dots = 8;
  for (let i = 1; i <= dots; i++) {
    const k = i / dots;
    ctx.fillStyle = col;
    ctx.globalAlpha = 1 - k * 0.65;
    ctx.beginPath();
    ctx.arc(b.x + dx * k * 1.6, b.y + dy * k * 1.6, 4.2 * (1 - k * 0.35), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = col;
  ctx.font = "900 16px Trebuchet MS, sans-serif";
  ctx.textAlign = "center";
  ctx.strokeStyle = "#1a2438";
  ctx.lineWidth = 4;
  const label = pow < 0.45 ? "SOFT" : pow < 0.75 ? "GOOD" : "FIRM";
  ctx.strokeText(label, p.x, p.y + 22);
  ctx.fillText(label, p.x, p.y + 22);
}

function drawCupCavity(heavy) {
  const s = worldToScreen(hole);
  ctx.save();
  ctx.fillStyle = heavy ? "rgba(6, 10, 8, 0.88)" : "rgba(6, 10, 8, 0.28)";
  ctx.beginPath();
  ctx.ellipse(s.x, s.y + 0.6, 9.4 * s.scale, 5.2 * s.scale, 0, 0, Math.PI * 2);
  ctx.fill();
  if (heavy) {
    ctx.fillStyle = "#020403";
    ctx.beginPath();
    ctx.ellipse(s.x, s.y + 1.4, 6.2 * s.scale, 3.4 * s.scale, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.strokeStyle = heavy ? "rgba(236, 240, 228, 0.4)" : "rgba(255,255,255,0.22)";
  ctx.lineWidth = heavy ? 1.6 : 1.2;
  ctx.beginPath();
  ctx.ellipse(s.x, s.y, 9.4 * s.scale, 5.2 * s.scale, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawBallAt(p, sc, t) {
  if (sc < 0.04) return;
  const s = worldToScreen(p);
  s.y += ballFall;
  const r = 14.2 * s.scale * sc;
  ctx.fillStyle = "rgba(10, 16, 10, " + (0.42 * Math.min(1, sc)) + ")";
  ctx.beginPath();
  ctx.ellipse(s.x + r * 0.08, s.y + r * 0.78, r * 0.82, r * 0.28, 0.12, 0, Math.PI * 2);
  ctx.fill();
  const overCup = phase === "sink" && dist(p, hole) < CFG.holeRadius * 2.4;
  ctx.save();
  if (overCup) {
    const h = worldToScreen(hole);
    ctx.beginPath();
    ctx.ellipse(h.x, h.y + 0.6, 9.6 * h.scale, 5.4 * h.scale, 0, 0, Math.PI * 2);
    ctx.clip();
  }
  ctx.translate(s.x, s.y);
  ctx.scale(stretch, squash);
  if (ballSpr.complete && ballSpr.naturalWidth) {
    const d = r * 2.12;
    ctx.drawImage(ballSpr, -d / 2, -d / 2, d, d);
  } else {
    const grd = ctx.createRadialGradient(-r * 0.28, -r * 0.38, r * 0.08, r * 0.12, r * 0.22, r * 1.08);
    grd.addColorStop(0, "#fffef8");
    grd.addColorStop(0.22, "#e8e4dc");
    grd.addColorStop(0.62, "#9aa09a");
    grd.addColorStop(1, "#3e4640");
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath();
    ctx.ellipse(-r * 0.28, -r * 0.38, r * 0.22, r * 0.14, -0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  if (ballFlash > 0.04) {
    ctx.fillStyle = "rgba(255,255,255," + (ballFlash * 0.35) + ")";
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function drawBall(t) {
  drawBallAt(ball, ballScale, t);
}

function drawParticles(dt) {
  particles = particles.filter((p) => p.life > 0);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.life -= dt * 1.4;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.c;
    if (p.rect) ctx.fillRect(p.x, p.y, p.r * 2.2, p.r * 0.8);
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

function drawTrail() {
  if (trail.length < 2 || phase === "sink") return;
  for (let i = 0; i < trail.length; i++) {
    const s = worldToScreen(trail[i]);
    const a = (i + 1) / trail.length * 0.16;
    ctx.globalAlpha = a;
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.beginPath();
    ctx.ellipse(s.x, s.y + 6, 3.2 * s.scale, 1.4 * s.scale, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawMotes(t) {}
function drawCupPulse(t) {
  if (phase !== "aim") return;
  const s = worldToScreen(hole);
  const k = 0.5 + 0.5 * Math.sin(t * 3.4);
  ctx.strokeStyle = "rgba(255,255,255," + (0.22 + 0.28 * k) + ")";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(s.x, s.y, 9 + k * 3, 5 + k * 1.6, 0, 0, Math.PI * 2);
  ctx.stroke();
}
function drawGhost(t) {
  if (phase !== "aim" || dragging || shotIndex > 0 || window.__qa.shots > 0) return;
  if (appearAt && now() - appearAt < 220) return;
  const from = window.__qa.idealFrom, to = window.__qa.idealTo;
  if (!from || !to) return;
  const cycle = (t % 1.25) / 1.25;
  const k = cycle < 0.72 ? easeOutQuad(cycle / 0.72) : 0;
  const x = from.x + (to.x - from.x) * k;
  const y = from.y + (to.y - from.y) * k;
  ctx.save();
  ctx.globalAlpha = 0.32;
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(from.x, from.y);
  ctx.lineTo(x, y);
  ctx.stroke();
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = "#fffdf6";
  ctx.strokeStyle = "#1a2438";
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.arc(x, y, 13, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  if (k > 0.08 && k < 0.95) {
    ctx.font = "900 22px Trebuchet MS, sans-serif";
    ctx.textAlign = "center";
    ctx.lineWidth = 6;
    ctx.strokeText("DRAG", x, y + 32);
    ctx.fillStyle = "#fff";
    ctx.fillText("DRAG", x, y + 32);
  }
  ctx.restore();
}
function drawShock(t) {
  if (phase !== "sink" && phase !== "end") return;
  if (shotIndex < 2 && phase === "sink") return;
  const s = worldToScreen(hole);
  const k = (t % 0.6) / 0.6;
  ctx.strokeStyle = "rgba(255,255,255," + (1 - k) + ")";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(s.x, s.y, 12 + k * 70, 0, Math.PI * 2); ctx.stroke();
}

function loop(ts) {
  if (!t0) t0 = ts;
  const t = (ts - t0) / 1000;
  const dt = Math.min(0.033, (ts - last) / 1000 || 0.016);
  last = ts;

  trauma = Math.max(0, trauma - dt * CFG.juice.decay);
  const shake = trauma * trauma;
  const tt = ts * 0.03;
  const nx = 0.6 * Math.sin(tt * 11.0) + 0.4 * Math.sin(tt * 23.0);
  const ny = 0.6 * Math.sin(tt * 13.0 + 1.7) + 0.4 * Math.sin(tt * 19.0 + 0.4);
  const nr = 0.6 * Math.sin(tt * 9.0 + 0.8) + 0.4 * Math.sin(tt * 17.0);
  const sx = CFG.juice.maxOffset * shake * nx;
  const sy = (CFG.juice.maxOffset * 0.7) * shake * ny;
  const roll = CFG.juice.maxRoll * shake * nr;
  shakeEl.style.transform = "translate(" + sx.toFixed(2) + "px," + sy.toFixed(2) + "px) rotate(" + roll.toFixed(4) + "rad)";
  punch = Math.max(0, punch - dt * 0.55);

  if (scoreShown < scoreTarget) {
    scoreShown = Math.min(scoreTarget, scoreShown + Math.max(3, (scoreTarget - scoreShown) * 0.18));
    scoreNum.textContent = String(Math.round(scoreShown));
  }

  stepPhysics(dt);
  if (phase === "aim" && appearAt) {
    const k = clamp((now() - appearAt) / 260, 0, 1);
    ballScale = easeOutBack(k);
    if (k >= 1) { ballScale = 1; appearAt = 0; }
  }
  if (phase === "aim") syncIdeal();
  if (phase === "aim" && !dragging && now() - idleAt > CFG.hintIdleMs && !hintEl.classList.contains("show")) showHint();

  const camT = camAt ? clamp((now() - camAt) / 1500, 0, 1) : 1;
  const zoom = (phase === "intro" ? lerp(2.25, 1.05, easeOutQuad(camT)) : 1) + punch;
  const holeS = hole ? worldToScreen(hole) : { x: W * 0.5, y: H * 0.44 };
  const fxs = phase === "intro" ? lerp(holeS.x, W * 0.5, easeOutQuad(camT)) : W * 0.5;
  const fys = phase === "intro" ? lerp(holeS.y, H * 0.58, easeOutQuad(camT)) : H * 0.5;

  ctx.save();
  if (zoom > 1.001) {
    ctx.translate(W / 2, H / 2);
    ctx.scale(zoom, zoom);
    ctx.translate(-fxs, -fys);
  }
  drawPlate();
  drawBeam(t);
  drawMotes(t);
  if (!plateOk()) {
    drawCliff();
    drawGreen(t);
    drawTrees(t);
  }
  drawCupCavity(phase === "sink");
  drawHole(t);
  drawCupPulse(t);
  drawTrail();
  drawAim();
  drawGhost(t);
  if (phase === "intro" && tease) drawBallAt(tease, 1, t);
  else drawBall(t);
  if (phase === "sink") drawCupCavity(true);
  drawShock(t);
  drawParticles(dt);
  ctx.restore();

  requestAnimationFrame(loop);
}

function start() {
  if (started) return;
  started = true;
  bannerText.textContent = CFG.hookCaption;
  setCaddie(CFG.introLine, "");
  hole = { x: CFG.shots[0].hole.x, y: CFG.shots[0].hole.y };
  ball = { x: CFG.shots[0].ball.x, y: CFG.shots[0].ball.y };
  vel = { x: 0, y: 0 };
  ballScale = 0;
  tease = { x: hole.x - 0.05, y: hole.y + 0.16, vx: 0.22, vy: -0.62 };
  camAt = now();
  setPhase("intro");
  window.__qa.ready = true;
  window.__qa.shotIndex = 0;
  addTrauma(0.16);
  setTimeout(() => { if (flashEl.classList.contains("in")) flashEl.classList.remove("in"); }, 500);
  setTimeout(() => {
    tease = null;
    resetShot(0);
    setCaddie(CFG.caddieLine, "");
  }, 780);
  setTimeout(() => { if (!ended) showEnd(); }, CFG.autoEndMs);
  requestAnimationFrame(loop);
}

function whenReady() {
  let go = false;
  const run = () => { if (go) return; go = true; start(); };
  setTimeout(run, 300);
  try {
    if (window.mraid) {
      if (window.mraid.getState && window.mraid.getState() === "loading") {
        window.mraid.addEventListener("ready", run);
      } else run();
    }
  } catch (e) { run(); }
}
whenReady();
</script>
</body>
